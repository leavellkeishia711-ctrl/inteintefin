services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: fi
      POSTGRES_DB: financeintel
    ports: ["5432:5432"]
    volumes: 
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi"]
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
