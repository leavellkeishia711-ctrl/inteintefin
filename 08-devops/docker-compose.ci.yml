services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: fi
      POSTGRES_DB: financeintel
    volumes: 
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../04-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fi:fi@db:5432/financeintel
      - DATABASE_URL_MIGRATIONS=postgresql+asyncpg://fi:fi@db:5432/financeintel
      - APP_USER_DATABASE_URL=postgresql+asyncpg://app_user:app@db:5432/financeintel
      - REDIS_URL=redis://redis:6379/0
      - DB_SSLMODE=prefer
    env_file:
      - ../08-devops/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  celery-worker:
    build:
      context: ../04-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://fi:fi@db:5432/financeintel
      - APP_USER_DATABASE_URL=postgresql+asyncpg://app_user:app@db:5432/financeintel
      - REDIS_URL=redis://redis:6379/0
      - DB_SSLMODE=prefer
    env_file:
      - ../08-devops/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  celery-beat:
    build:
      context: ../04-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://fi:fi@db:5432/financeintel
      - APP_USER_DATABASE_URL=postgresql+asyncpg://app_user:app@db:5432/financeintel
      - REDIS_URL=redis://redis:6379/0
      - DB_SSLMODE=prefer
    env_file:
      - ../08-devops/.env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: ../05-frontend
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
