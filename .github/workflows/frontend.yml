name: Frontend CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main", "feat/**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./05-frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: './05-frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm install
        
    - name: Run lint
      run: npm run lint
        
    - name: Build Next.js
      run: npm run build
