name: Backend CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main", "feat/**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./04-backend
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fi
          POSTGRES_PASSWORD: fi
          POSTGRES_DB: financeintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Set up env variables & roles
      run: |
        cp .env.example .env
        echo "DATABASE_URL=postgresql+asyncpg://fi:fi@localhost:5432/financeintel" >> .env
        echo "DATABASE_URL_MIGRATIONS=postgresql+asyncpg://fi:fi@localhost:5432/financeintel" >> .env
        echo "APP_USER_DATABASE_URL=postgresql+asyncpg://app_user:app@localhost:5432/financeintel" >> .env
        echo "DB_SSLMODE=prefer" >> .env
        python scripts/setup_ci_db.py 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        
    - name: Run Alembic migrations
      run: |
        alembic upgrade head 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        
    - name: Run check_floats.py
      run: |
        python scripts/check_floats.py 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        
    - name: Run Pytest
      run: |
        pytest -v --tb=short --junitxml=pytest-results.xml 2>&1 | tee -a $GITHUB_STEP_SUMMARY

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-results
        path: 04-backend/pytest-results.xml
